<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Anne & Chris – Einladungskarte mit QR zur Hochzeitswebsite">
  <title>Anne & Chris – Foto-Karte (Druck)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="print-karte-foto.css">
</head>
<body>
  <article class="photo-card">
    <img
      class="photo-card__image"
      src="images/print-karte-foto.jpg"
      alt=""
      width="1050"
      height="1480"
    >

    <div class="photo-card__overlay" aria-hidden="true"></div>

    <div class="photo-card__content">
      <div class="photo-card__qr-panel">
        <img
          class="photo-card__qr"
          src="images/qr-hochzeit-anne-chris.png"
          width="96"
          height="96"
          alt="QR-Code zur Hochzeitswebsite"
        >
      </div>

      <p class="photo-card__url">hochzeit-anne-und-chris.top</p>
      <p class="photo-card__password">Passwort: WEDDING</p>
    </div>
  </article>
</body>
</html>
